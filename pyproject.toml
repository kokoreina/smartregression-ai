[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "smartregression-ai"
version = "0.1.0"
description = "Bootstrap contracts, API and CLI for SmartRegression AI"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.119,<1", "pydantic>=2.12,<3", "uvicorn>=0.37,<1"]

[project.scripts]
smartregression = "smartregression.cli.main:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/smartregression"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".tools", ".uv-cache", ".npm-cache", "node_modules", "var", "pytest-cache-files-*"]
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
